          - runner: macos-latest
            label: arm64 macOS
          - runner: ubuntu-latest
            label: x86_64 Linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Homebrew is NOT preinstalled on the Ubuntu 24.04 runner image, which is
      # what `ubuntu-latest` now resolves to — the Linux jobs here died with a
      # bare `brew: command not found` (exit 127) until this step existed. It is
