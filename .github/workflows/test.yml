name: test

# Prove the formula installs a working `navigator` on the platforms it claims.
#
# The four platforms split into two classes, and they are tested on different
# schedules because they cost wildly different amounts of runner time:
#
#   PREBUILT (arm64 macOS, x86_64 Linux) — one archive download. Tested on every
#   push and pull request, because that is the path essentially every reader
#   takes and it is cheap enough to gate on.
#
#   SOURCE (Intel macOS, arm64 Linux) — a cold compile of the whole Rust
#   workspace, tens of minutes. Tested weekly and on demand. Gating every push
#   on it would make a one-line formula edit an hour-long wait, and the thing it
#   catches — a source tree that stopped building on a second architecture —
#   does not change between two pushes to this repository.
#
# All four runner classes are free for public repositories, which is the only
# reason the source lane is affordable at all.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 14:00 UTC. Late enough in the UTC day that the previous week's
    # releases have all landed and been bumped.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# THE INSTALL JOBS ARE NEVER SKIPPED. They were, once: a `seeded` job read the
# formula for the all-zero placeholder digests a freshly created tap ships with
# and skipped every downloading job while they were there, so that a brand-new
# repository would not be red for an expected, self-resolving reason.
#
# It did not self-resolve. The first bump never came — `deploy.yml` dispatched to
# this tap for ordinary `YY.M.D` releases only, and three of those failed their
# end-to-end gate in a row — so the placeholder formula sat here for days serving
# a 404 to every `brew install`, with this workflow green the whole time. A gate
# that reports success for a formula that cannot install is worse than no gate,
# because it is read as proof.
#
# The formula is bumped now and `bump.sh` asserts no placeholder survives a bump,
# so there is no state left for that exemption to describe.
jobs:
  style:
    name: audit the formula
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Homebrew is NOT preinstalled on the Ubuntu 24.04 runner image, which is
      # what `ubuntu-latest` now resolves to — the Linux jobs here died with a
      # bare `brew: command not found` (exit 127) until this step existed. It is
      # a no-op on the macOS runners, which do ship brew, so every job takes it
      # rather than making the reader work out which ones need it.
      #
      # Pinned by SHA: this action runs with the job's token and configures the
      # tool the whole workflow trusts, so `@master` would be an unpinned
      # dependency in the middle of the supply chain.
      - uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4
      # `setup-homebrew` registers THIS repository as the tap, so there is no
      # `brew tap` to run — issuing one against the workspace path collides with
      # the registration it already made ("remote mismatch") and fails the job.
      #
      # It registers it under the name Homebrew gives an `OWNER/homebrew-NAME`
      # repository, which is `OWNER/NAME`. THAT NAME IS NOT A CONSTANT: it
      # follows whoever owns this repository, so it is derived below from
      # `GITHUB_REPOSITORY` — the same value `setup-homebrew` reads — rather
      # than written down. A literal here is only ever correct until the next
      # transfer: the last one left this name pointing at a previous owner,
      # every job asked `brew` for a tap nobody had registered, and the formula
      # stopped following releases for three days with no diff to explain it,
      # because the tree never changed.
      #
      # What that leaves worth checking is which tree the qualified name now
      # resolves to. If the tap pointed at the GitHub remote rather than this
      # checkout, every job below would silently test `main` instead of the
      # commit under test, and a pull request could go green on a formula it
      # does not contain.
      - name: confirm the tap is this checkout
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          tap="${owner}/${name#homebrew-}"
          # Every later step in this job addresses the formula through this
          # name, so it is derived once here rather than in each of them.
          echo "TAP=${tap}" >> "${GITHUB_ENV}"

          tap_path="$(brew --repository "${tap}")"
          echo "tap ${tap} resolves to ${tap_path}"
          # `brew --repository` composes a path and never looks at it, so a tap
          # nobody registered still yields a plausible string. Say that here:
          # without this the job dies on the next line with a bare `cd: No such
          # file or directory`, which names the symptom and not the cause, and
          # is most of why the last such break took three days to read.
          if [ ! -d "${tap_path}" ]; then
              echo "::error::no tap named ${tap} is registered — ${tap_path} does not exist. setup-homebrew registers this checkout under the name derived from ${GITHUB_REPOSITORY}, so this job and that action disagree about what the tap is called"
              exit 1
          fi
          resolved="$(cd "${tap_path}" && pwd -P)"
          workspace="$(cd "${GITHUB_WORKSPACE}" && pwd -P)"
          if [ "${resolved}" != "${workspace}" ]; then
              echo "::error::the tap resolves to ${resolved}, not this checkout (${workspace}) — CI would be testing a different tree than the one under review"
              exit 1
          fi
      # Pure Ruby style. It reads the formula and fetches nothing, so it is the
      # one real signal available before the first bump and runs unconditionally.
      # Scoped to the formula, NOT the whole tap. `brew style <tap>` also runs
      # shfmt and shellcheck over every shell script in the repository against
      # Homebrew's house profile, which is written for Homebrew's own scripts —
      # it reformats `while ...; do` onto two lines and re-indents to two
      # spaces. `scripts/bump.sh` is this repository's tooling rather than a
      # Homebrew script, so enforcing that profile on it buys nothing and taxes
      # every edit. The genuine findings it surfaced (masked return values,
      # `[ ]` over `[[ ]]`) are fixed in the script itself.
      - name: brew style
        run: |
          set -euo pipefail
          brew style Formula/navigator.rb
      # `--online` checks the homepage and that every URL resolves, so it can
      # only run once those URLs name a real release. NOT `--strict`: that
      # enforces homebrew-core submission rules, several of which a tap is
      # entitled to ignore, and a gate that fails for reasons you intend to keep
      # is a gate people learn to skip.
      #
      # `--except=version` is that same judgement applied to one more rule, and
      # the formula's `version` line is the reason. Homebrew reads a version out
      # of the URL and calls an explicit `version` redundant when the two agree.
      # They agree for an ordinary `YY.M.D` tag and do NOT for a
      # `YY.M.D-hotfix.N` one. Measured with `Version.detect`, for the two
      # shapes this tap publishes:
      #
      #   .../download/26.8.24/navigator-26.8.24-linux.tar.gz          -> 26.8.24
      #   .../download/26.8.22-hotfix.23/navigator-...-linux.tar.gz    -> 26.8.22
      #   .../archive/refs/tags/26.8.24.tar.gz                         -> 26.8.24
      #   .../archive/refs/tags/26.8.22-hotfix.23.tar.gz               -> 23
      #
      # So the line is REFUSED for an ordinary release and REQUIRED for a
      # hotfix: drop it there and the formula quietly claims `26.8.22`, with no
      # audit failure to show for it. Every bump before `26.8.24` was a hotfix,
      # which is why this rule had never fired here and now fires on every
      # ordinary release.
      #
      # Declaring the version always is the safer half of that trade. It never
      # depends on a scanner this tap has measured getting its own releases
      # wrong, and it keeps the formula one shape rather than a shape that
      # depends on which kind of tag it happens to hold. What `--except=version`
      # gives up is the rest of `audit_version`: a missing-version check, which
      # the step below and `bump.sh` both make more strictly, and an OCI tag
      # rule that applies to core or bottled formulae, which this is neither.
      - name: brew audit
        run: brew audit --online --except=version --formula "${TAP}/navigator"

      # The one thing `--except=version` gave up that could actually bite. The
      # formula must SAY its version, because Homebrew's fallback is to infer
      # one and its inference is wrong for half the tags this tap publishes.
      # `bump.sh` asserts this at publish time; this asserts it for a hand edit,
      # which is the path `bump.sh` never sees.
      - name: the formula declares its version explicitly
        run: |
          set -euo pipefail
          if ! grep -Eq '^[[:space:]]*version "[^"]+"$' Formula/navigator.rb; then
              echo "::error::Formula/navigator.rb declares no explicit version. Homebrew would infer one from the URL, and for a YY.M.D-hotfix.N tag it infers the base version instead — 26.8.22 for 26.8.22-hotfix.23 — with no audit failure to show for it."
              exit 1
          fi
          grep -E '^[[:space:]]*version "[^"]+"$' Formula/navigator.rb

  prebuilt:
    name: install on ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two architectures a Navigator release actually publishes bytes
